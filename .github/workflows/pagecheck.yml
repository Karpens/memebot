name: Page check

# Opens the live page (GitHub Pages) in a real browser on a phone-sized screen and reports whether it follows the
# bot every second (the LIVE · 1s pill, the balance changing), with a screenshot as an artifact. It changes nothing.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "How long to watch"
        required: false
        default: "40"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --no-save --silent playwright@1.49.1 && npx playwright install --with-deps chromium > /dev/null
      - run: node tools/pagecheck.js https://karpens.github.io/memebot/ "${{ inputs.seconds || 40 }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pagecheck
          path: pagecheck.png
