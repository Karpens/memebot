name: Study

# The edge study (memebot/study.py) on the live bot's recorded tapes, on GitHub's runners: does ANY long-only rule on
# the new coins' first 15 minutes beat the real costs on held-out time? Run it from the Actions tab (Study, Run
# workflow) or: gh workflow run study.yml -f hours=24 -f split=0.7
#   1. memebot/fetch_tapes.py downloads the artifacts tapes-<run id>-<attempt> that memebot.yml's jobs upload when
#      they end (kept 14 days), those of the jobs that ended in the last `hours` hours, into tapes/<run>-<attempt>/
#      (the REST API with this job's own token: permissions actions: read). Only the live bot's own runs (schedule
#      and workflow_dispatch on the default branch: never a pull request's run), the newest first and at most
#      500 MB unzipped in all (--max-mb, as the backtest: the study keeps the whole tape in memory, one process,
#      about 6x its size measured). None found: it says so, and the run ends green without a study (the job
#      running now uploads its tapes only when it ends).
#   2. memebot/study.py --data tapes: every rule family the designs proposed, the base rows and the bot's current
#      rule, through the engine's own cost maths; ranked on the first `split` of the create-time range, every ranked
#      combination judged once on the held-out rest at the same Bonferroni z, the top 15 shown with every pass (the
#      PASS gates: memebot/study.py's doc).
#   3. The summary goes into the log and the job's summary page (the verdict, the costs, the calibration against the
#      bot's own booked trades, the top rules on the held-out part, the base rows); study.json (with fetched.json:
#      what was downloaded) is the artifact study-<run id>, kept 30 days.
# Read-only: it never pushes (contents: read), never fetches or writes the meme-data branch, never runs the live bot
# or its recorder (MEMEBOT_REC=0), never publishes on the live channel (MEMEBOT_LIVE=0) and never changes
# config.json: a rule that passes is a hint for a person to judge. Paper on paper: a pass on the held-out part is a
# hint, not a promise.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Tapes of the jobs that ended in the last N hours; the newest 500 MB unzipped at most (about a day of busy tape, memory is the limit)"
        required: false
        default: "24"
      split:
        description: "The first part's share of the create-time range, ranked on (0.1 to 0.95); the rest is held out"
        required: false
        default: "0.7"

permissions:
  contents: read
  actions: read

concurrency:
  group: study
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MEMEBOT_LIVE: "0"                    # never the live channel
      MEMEBOT_REC: "0"                     # never a new tape
      MEMEBOT_FEEDS: "0"                   # never a live feed
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false       # the token is not left in git's config: nothing here pushes

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: The tapes (the artifacts tapes-<run id>-<attempt> of memebot.yml)
        id: tapes
        env:
          GH_TOKEN: ${{ github.token }}
          HOURS: ${{ inputs.hours }}
        run: |
          python3 memebot/fetch_tapes.py fetch --repo "$GITHUB_REPOSITORY" --workflow memebot.yml \
            --hours "${HOURS:-24}" --max-mb 500 --out tapes --manifest fetched.json \
            --md "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"

      # the summary goes to the log (stdout) and to the job's summary page (--md); the progress lines to stderr
      - name: The study (memebot/study.py)
        if: steps.tapes.outputs.count != '0'
        env:
          SPLIT: ${{ inputs.split }}
        run: |
          python3 memebot/study.py --data tapes --split "${SPLIT:-0.7}" --out study.json --md "$GITHUB_STEP_SUMMARY"

      - name: The report (artifact study-<run id>, kept 30 days)
        if: always() && hashFiles('study.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: study-${{ github.run_id }}
          path: |
            study.json
            fetched.json
          retention-days: 30
          if-no-files-found: ignore
