name: Meme Bot

# The meme-coin paper bot (memebot/bot.py): New Pairs (brand-new pump.fun coins on their bonding
# curve), around the clock (config.json session 00:00 → 00:00; each day is its own "night" in the
# book), no wallet and no real money. Its data goes to the meme-data branch.
# A public repository gets GitHub Actions minutes for free. A job may run at most 6 hours, so every
# job starts the next one when it ends. The hourly cron below is only the safety net: while a job
# runs, a scheduled run waits as the one pending run of the group and the next job's dispatch takes
# its place, so it starts the bot again only when the chain broke (a failed or cancelled job). The
# Run workflow button starts it any time ("anytime" for a test outside the session).

on:
  schedule:
    - cron: "17 * * * *"                    # hourly safety net (see above)
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to run (empty: 5 h 40 min, then the next job starts)"
        required: false
        default: ""
      anytime:
        description: "A test run outside the session (sold at its end); not needed while the bot runs 24/7"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: memebot
  cancel-in-progress: false

jobs:
  night:
    if: github.event_name == 'workflow_dispatch' || vars.MEMEBOT_OFF != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: PumpPortal's stream for New Pairs (websockets; without it the bot runs on, with no new pairs)
        run: |
          pip install -q websockets==17.4 || echo "websockets not installed, the night runs without PumpPortal"

      - name: The bot's data (branch meme-data)
        run: |
          git config --global user.name "memebot"
          git config --global user.email "memebot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin meme-data > /dev/null; then
            git fetch -q origin meme-data
            git worktree add -q --detach memedata origin/meme-data
          else
            git worktree add -q --detach memedata
            cd memedata && git checkout -q --orphan meme-data && git rm -rfq .
          fi

      - name: The night
        env:
          MINUTES: ${{ inputs.minutes }}
          ANYTIME: ${{ inputs.anytime }}
        run: |
          save() {
            ( cd memedata && git add -A && { git diff --cached --quiet || git commit -q -m "meme-data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"; } \
              && for i in 1 2 3; do git push -q origin HEAD:meme-data && break; sleep $((i * 5)); done ) || true
          }
          ( sleep 20; save; while sleep 30; do save; done ) &       # the live page reads it every 15 seconds
          SAVER=$!
          ARGS="--minutes ${MINUTES:-340}"
          [ "$ANYTIME" = "true" ] && ARGS="$ARGS --anytime"
          python3 memebot/bot.py run --data memedata $ARGS --summary "$GITHUB_STEP_SUMMARY" || true
          kill $SAVER 2>/dev/null || true
          python3 memebot/bot.py page --data memedata --out memedata/index.html
          save

      - name: The rest of the night
        if: inputs.anytime != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # still the session (more than 10 minutes before its end; always, when it runs 24/7)? then the next job takes over
          LEFT=$(python3 -c "import sys, datetime; sys.path.insert(0, 'memebot'); import bot; c = bot.load_config(); s = bot.session_of(datetime.datetime.utcnow(), c); print(bot.ALWAYS_LEFT if bot.always_on(c) else (int(s[2]) if s else 0))")
          if [ "$LEFT" -gt 10 ]; then gh workflow run memebot.yml --ref "$GITHUB_REF_NAME"; echo "next job started ($LEFT min left)"; fi
